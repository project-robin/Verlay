[package]
name = "croc-transfer-desktop"
version = "0.1.0"
description = "A minimal desktop interface for croc file transfer"
authors = ["Croc contributors"]
edition = "2021"

[lib]
name = "croc_transfer_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 16
lto = false
opt-level = "s"
strip = true
