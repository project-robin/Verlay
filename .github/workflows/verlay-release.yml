name: Verlay CLI release

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
      - run: go test ./...
      - run: bash -n scripts/bootstrap-agent.sh scripts/install-verlay-linux.sh scripts/test-install-verlay-linux.sh
      - run: ./scripts/validate-agent-skill.sh

  build:
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            asset: verlay-linux-amd64
          - goos: linux
            goarch: arm64
            asset: verlay-linux-arm64
          - goos: windows
            goarch: amd64
            asset: verlay-windows-amd64.exe
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
      - name: Build Verlay
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.event.release.tag_name || 'dev' }}
        run: go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o "${{ matrix.asset }}" ./cmd/verlay
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - run: sha256sum verlay-* > verlay-checksums.txt
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            verlay-*
            LICENSE
            NOTICE
