name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    name: Go unit tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '^1.26.0'
      
      - name: Display Go version
        run: go version

      - name: Run unit tests
        run: go test -v ./...

      - name: Validate Agent Skill and installers
        run: |
          bash -n scripts/bootstrap-agent.sh scripts/install-verlay-linux.sh scripts/install-mesh-linux.sh scripts/validate-agent-skill.sh
          ./scripts/validate-agent-skill.sh
          test_home="$(mktemp -d)"
          HOME="$test_home" VERLAY_SKILL_METHOD=copy ./scripts/bootstrap-agent.sh --skill-only
          test -f "$test_home/.agents/skills/verlay/SKILL.md"
          test -f "$test_home/.agents/skills/verlay/references/security.md"
          HOME="$test_home" XDG_CONFIG_HOME="$test_home/.config" \
            XDG_DATA_HOME="$test_home/.local/share" XDG_RUNTIME_DIR="$test_home/run" \
            VERLAY_INSTALL_ROOT="$test_home/.local" \
            VERLAY_INSTALL_START_SERVICE=0 VERLAY_INSTALL_SOURCE=checkout \
            GOCACHE="$RUNNER_TEMP/verlay-go-cache" ./scripts/install-verlay-linux.sh
          "$test_home/.local/bin/verlay" --json version
          test "$(readlink "$test_home/.local/bin/verlayd")" = verlay
          test "$(readlink "$test_home/.local/bin/mesh")" = verlay
          grep -q 'ExecStart=.*/verlayd' "$test_home/.config/systemd/user/verlayd.service"

      - name: Build files
        run: |
          go version
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags '-extldflags "-static"' -o croc-windows-amd64.exe
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -ldflags '-extldflags "-static"' -o croc-windows-arm64.exe
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags '-extldflags "-static"' -o croc-linux-amd64
          CGO_ENABLED=0 GOOS=linux GOARCH=386 go build -ldflags '-extldflags "-static"' -o croc-linux-386
          CGO_ENABLED=0 GOOS=linux GOARCH=arm go build -ldflags '-extldflags "-static"' -o croc-linux-arm
          GOARM=5 CGO_ENABLED=0 GOOS=linux GOARCH=arm go build -ldflags '-extldflags "-static"' -o croc-linux-arm5
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags '-extldflags "-static"' -o croc-linux-arm64
          CGO_ENABLED=0 GOOS=linux GOARCH=riscv64 go build -ldflags '-extldflags "-static"' -o croc-linux-riscv64
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags '-s -extldflags "-sectcreate __TEXT __info_plist Info.plist"' -o croc-darwin-amd64
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags '-s -extldflags "-sectcreate __TEXT __info_plist Info.plist"' -o croc-darwin-arm64
          CGO_ENABLED=0 GOOS=freebsd GOARCH=amd64 go build -ldflags '' -o croc-freebsd-amd64
          CGO_ENABLED=0 GOOS=freebsd GOARCH=arm64 go build -ldflags '' -o croc-freebsd-arm64
          CGO_ENABLED=0 GOOS=openbsd GOARCH=amd64 go build -ldflags '' -o croc-openbsd-amd64
          CGO_ENABLED=0 GOOS=openbsd GOARCH=arm64 go build -ldflags '' -o croc-openbsd-arm64
      - name: Check static build of the linux version
        run: |
          if ldd croc-linux-amd64 2>&1 | grep -q "not a dynamic executable"; then
            echo "Static build confirmed."
          else
            echo "Error: croc-linux-amd64 is a dynamic executable."
            exit 1
          fi

  windows-bootstrap:
    name: Windows bootstrap
    runs-on: windows-2025
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'

      - name: Install and verify Verlay
        shell: pwsh
        run: |
          $installRoot = Join-Path $env:RUNNER_TEMP "Verlay"
          $skillHome = Join-Path $env:RUNNER_TEMP "skills"
          ./scripts/bootstrap-agent.ps1 -InstallRoot $installRoot -SkillHome $skillHome -NoStart
          & "$installRoot/bin/verlay.exe" --json schema
          if (-not (Test-Path "$installRoot/bin/verlayd.exe")) { throw "verlayd.exe was not installed" }
          if (-not (Test-Path "$skillHome/verlay/SKILL.md")) { throw "Verlay Agent Skill was not installed" }
