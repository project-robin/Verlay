name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    name: Go unit tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '^1.26.0'
      
      - name: Display Go version
        run: go version

      - name: Run unit tests
        run: go test -v ./...

      - name: Validate Agent Skill and installers
        run: |
          bash -n scripts/bootstrap-agent.sh scripts/install-verlay-linux.sh scripts/validate-agent-skill.sh
          ./scripts/validate-agent-skill.sh
          test_home="$(mktemp -d)"
          HOME="$test_home" VERLAY_SKILL_METHOD=copy ./scripts/bootstrap-agent.sh --skill-only
          test -f "$test_home/.agents/skills/verlay/SKILL.md"
          test -f "$test_home/.agents/skills/verlay/references/security.md"
          HOME="$test_home" XDG_CONFIG_HOME="$test_home/.config" \
            XDG_DATA_HOME="$test_home/.local/share" XDG_RUNTIME_DIR="$test_home/run" \
            VERLAY_INSTALL_ROOT="$test_home/.local" \
            VERLAY_INSTALL_START_SERVICE=0 VERLAY_INSTALL_SOURCE=checkout \
            GOCACHE="$RUNNER_TEMP/verlay-go-cache" ./scripts/install-verlay-linux.sh
          "$test_home/.local/bin/verlay" --json version
          test "$(readlink "$test_home/.local/bin/verlayd")" = verlay
          grep -q 'ExecStart=.*/verlayd' "$test_home/.config/systemd/user/verlayd.service"

      - name: Build Verlay
        run: CGO_ENABLED=0 go build -trimpath -o verlay ./cmd/verlay

  windows-bootstrap:
    name: Windows bootstrap
    runs-on: windows-2025
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'

      - name: Install and verify Verlay
        shell: pwsh
        run: |
          $installRoot = Join-Path $env:RUNNER_TEMP "Verlay"
          $skillHome = Join-Path $env:RUNNER_TEMP "skills"
          ./scripts/bootstrap-agent.ps1 -InstallRoot $installRoot -SkillHome $skillHome -NoStart
          & "$installRoot/bin/verlay.exe" --json schema
          if (-not (Test-Path "$installRoot/bin/verlayd.exe")) { throw "verlayd.exe was not installed" }
          if (-not (Test-Path "$skillHome/verlay/SKILL.md")) { throw "Verlay Agent Skill was not installed" }
