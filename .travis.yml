language: go

go:
  - tip

env:
  - "PATH=/home/travis/gopath/bin:$PATH"

install: true

script:
  - env GO111MODULE=on go build -v
  - env GO111MODULE=on go test -v -cover github.com/project-robin/Verlay/src/compress
  - env GO111MODULE=on go test -v -cover github.com/project-robin/Verlay/src/croc
  - env GO111MODULE=on go test -v -cover github.com/project-robin/Verlay/src/crypt
  - env GO111MODULE=on go test -v -cover github.com/project-robin/Verlay/src/tcp
  - env GO111MODULE=on go test -v -cover github.com/project-robin/Verlay/src/utils
  - env GO111MODULE=on go test -v -cover github.com/project-robin/Verlay/src/comm

branches:
  except:
    - dev
    - win
